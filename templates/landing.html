<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GestureTalk — Where Signs Talk</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream:#fdf6ee; --ink:#1a1208; --rust:#e85d2a; --rust2:#c8441a; --sage:#4a7c59;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
              font-family:"DM Sans",sans-serif;color:var(--ink);}

    body::after{content:"";position:fixed;inset:0;z-index:200;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.05'/%3E%3C/svg%3E");
      background-size:200px;mix-blend-mode:multiply;}

    .hands-frame{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden;}
    .hands-img{width:100%;height:100%;object-fit:cover;object-position:center;
               transform:scale(1.42);filter:sepia(0.42) hue-rotate(6deg) saturate(1.3) brightness(0.86);
               animation:reveal 2.8s cubic-bezier(.76,0,.24,1) .1s forwards;}
    @keyframes reveal{0%{transform:scale(1.42)}100%{transform:scale(1.0)}}
    .wash{position:absolute;inset:0;
          background:radial-gradient(ellipse at center,rgba(232,93,42,.24) 0%,rgba(26,18,8,.64) 100%);
          animation:washOut 2.6s ease-out .1s forwards;}
    @keyframes washOut{0%{opacity:1}100%{opacity:0}}

    .center{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
            align-items:center;justify-content:center;text-align:center;padding:28px;
            opacity:0;animation:rise 1s ease-out 2.1s forwards;}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

    .rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
    .ring{position:absolute;border-radius:50%;border:1px dashed rgba(26,18,8,.07);}
    .r1{width:310px;height:310px;animation:spin 24s linear infinite;}
    .r2{width:460px;height:460px;border-color:rgba(232,93,42,.06);animation:spin 36s linear reverse infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage);color:#fff;
           border-radius:100px;padding:6px 18px;font-size:.73rem;font-weight:600;
           letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;
           box-shadow:0 4px 20px rgba(74,124,89,.38);}

    .logo-pill{display:flex;align-items:center;gap:14px;background:var(--ink);
               border-radius:100px;padding:7px 28px 7px 7px;
               box-shadow:0 10px 48px rgba(26,18,8,.34),0 0 0 1px rgba(240,223,192,.12);
               margin-bottom:22px;}

    .logo-icon{width:56px;height:56px;border-radius:50%;background:var(--rust);
               display:grid;place-items:center;flex-shrink:0;overflow:hidden;}
    .logo-icon img{width:86%;height:86%;object-fit:contain;filter:none;}

    .logo-text{font-family:"Syne",sans-serif;font-size:1.55rem;font-weight:800;
               color:var(--cream);line-height:1;letter-spacing:-.02em;}

    .tagline{font-family:"Instrument Serif",serif;font-style:italic;
             font-size:clamp(1.45rem,3.6vw,2.55rem);color:var(--ink);line-height:1.24;
             max-width:500px;text-shadow:0 2px 28px rgba(253,246,238,.98);margin-bottom:20px;}
    .tagline .hl{color:var(--rust);font-style:normal;font-family:"Syne",sans-serif;font-weight:700;}

    .quote{max-width:390px;padding:15px 20px;background:rgba(253,246,238,.9);
           backdrop-filter:blur(10px);border-left:3px solid var(--rust);
           border-radius:0 14px 14px 0;text-align:left;margin-bottom:28px;
           box-shadow:0 4px 24px rgba(26,18,8,.08);}
    .quote p{font-family:"Instrument Serif",serif;font-style:italic;font-size:.91rem;
             line-height:1.68;color:var(--ink);margin-bottom:10px;}
    .quote-name{font-family:"Syne",sans-serif;font-size:.75rem;font-weight:700;
                letter-spacing:.06em;text-transform:uppercase;color:var(--rust);
                display:block;margin-bottom:2px;}
    .quote-role{font-family:"DM Sans",sans-serif;font-size:.68rem;font-weight:400;
                letter-spacing:.05em;text-transform:uppercase;color:rgba(26,18,8,.4);}

    .btn-start{display:inline-flex;align-items:center;gap:14px;background:var(--ink);
               color:var(--cream);border:none;border-radius:100px;padding:18px 44px;
               font-family:"DM Sans",sans-serif;font-size:1rem;font-weight:600;
               cursor:pointer;letter-spacing:.01em;box-shadow:0 8px 34px rgba(26,18,8,.3);
               transition:transform .2s,box-shadow .2s,background .22s;}
    .btn-start:hover{transform:translateY(-3px) scale(1.025);background:var(--rust2);
                     box-shadow:0 16px 48px rgba(200,68,26,.48);}
    .btn-start:active{transform:scale(.97);}
    .arrow{font-size:1.2rem;display:inline-block;transition:transform .2s;}
    .btn-start:hover .arrow{transform:translateX(5px);}
    .hint{margin-top:11px;font-size:.75rem;color:rgba(26,18,8,.42);letter-spacing:.03em;}

    .out{position:fixed;inset:0;z-index:999;background:var(--ink);opacity:0;
         pointer-events:none;transition:opacity .5s ease;}
    .out.go{opacity:1;}
  </style>
</head>
<body>
  <div class="hands-frame">
    <img class="hands-img" src="/static/hands-circle.png" alt="Signing hands"/>
    <div class="wash"></div>
  </div>
  <div style="position:fixed;inset:0;z-index:20;pointer-events:none;">
    <div class="rings"><div class="ring r1"></div><div class="ring r2"></div></div>
  </div>
  <div class="center">
    <div class="badge">🤟 Indian Sign Language</div>
    <div class="logo-pill">
      <div class="logo-icon">
        <img src="/static/logo.png" alt="GestureTalk"/>
      </div>
      <div class="logo-text">GestureTalk</div>
    </div>
    <div class="tagline">Where every <span class="hl">sign</span><br/>finds its voice.</div>
    <div class="quote">
      <p>"The limits of my language mean the limits of my world. Break those limits — give every hand a voice."</p>
      <span class="quote-name">Ludwig Wittgenstein (adapted)</span>
      <span class="quote-role">Philosopher</span>
    </div>
    <button class="btn-start" onclick="enterApp()">
      Let&rsquo;s Get Started <span class="arrow">→</span>
    </button>
    <div class="hint">ISL &nbsp;·&nbsp; Real-time detection &nbsp;·&nbsp; 20+ languages</div>
  </div>
  <div class="out" id="out"></div>
  <script>
    function enterApp(){
      document.getElementById('out').classList.add('go');
      setTimeout(()=>{window.location.href='/app';},580);
    }
  </script>
</body>
</html>
