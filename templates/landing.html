<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GestureTalk — Where Signs Talk</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0e0b18;
      --bg2:#191426;
      --ink:#f8f7fc;
      --muted:#b9b4c8;
      --accent:#b9a2f8;
      --accent2:#9b80e8;
      --panel:rgba(20,16,32,.78);
      --border:rgba(185,162,248,.20);
    }
    *,*::before,*::after{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      font-family:"Inter",sans-serif;
      color:var(--ink);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:200;
      pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.05'/%3E%3C/svg%3E");
      background-size:200px;
      opacity:.15;
    }
    .hands-frame{
      position:fixed;
      inset:0;
      z-index:10;
      pointer-events:none;
      overflow:hidden;
    }
    .hands-img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform:scale(1.35);
      filter:saturate(.7) brightness(.65);
      animation:reveal 2.8s cubic-bezier(.76,0,.24,1) .1s forwards;
    }
    @keyframes reveal{
      0%{transform:scale(1.35)}
      100%{transform:scale(1)}
    }
    .wash{
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at center,rgba(14,11,24,.28) 0%,rgba(14,11,24,.82) 100%);
      animation:washOut 2.6s ease-out .1s forwards;
    }
    @keyframes washOut{
      0%{opacity:1}
      100%{opacity:.35}
    }
    .center{
      position:fixed;
      inset:0;
      z-index:30;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:28px;
      opacity:0;
      animation:rise 1s ease-out 1.6s forwards;
    }
    @keyframes rise{
      from{opacity:0;transform:translateY(22px)}
      to{opacity:1;transform:translateY(0)}
    }
    .rings{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    .ring{
      position:absolute;
      border-radius:50%;
      border:1px dashed rgba(185,162,248,.12);
    }
    .r1{
      width:310px;
      height:310px;
      animation:spin 24s linear infinite;
    }
    .r2{
      width:460px;
      height:460px;
      border-color:rgba(185,162,248,.07);
      animation:spin 36s linear reverse infinite;
    }
    @keyframes spin{
      to{transform:rotate(360deg)}
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:rgba(185,162,248,.10);
      color:var(--accent);
      border:1px solid rgba(185,162,248,.22);
      border-radius:100px;
      padding:8px 18px;
      font-size:.75rem;
      font-weight:600;
      letter-spacing:.10em;
      text-transform:uppercase;
      margin-bottom:22px;
      box-shadow:0 4px 20px rgba(185,162,248,.08);
    }
    .logo-pill{
      display:flex;
      align-items:center;
      gap:14px;
      background:rgba(14,11,24,.82);
      border:1px solid rgba(255,255,255,.10);
      border-radius:100px;
      padding:8px 30px 8px 8px;
      box-shadow:0 10px 48px rgba(0,0,0,.32);
      backdrop-filter:blur(14px);
      margin-bottom:24px;
    }
    .logo-icon{
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--accent);
      display:grid;
      place-items:center;
      flex-shrink:0;
      overflow:hidden;
    }
    .logo-icon img{
      width:86%;
      height:86%;
      object-fit:contain;
    }
    .logo-text{
      font-family:"Space Grotesk",sans-serif;
      font-size:1.65rem;
      font-weight:700;
      color:var(--ink);
      line-height:1;
      letter-spacing:-.04em;
    }
    .tagline{
      font-family:"Space Grotesk",sans-serif;
      font-weight:500;
      font-size:clamp(1.6rem,4vw,2.8rem);
      color:var(--ink);
      line-height:1.25;
      max-width:550px;
      margin-bottom:22px;
      text-shadow:0 2px 20px rgba(0,0,0,.5);
    }
    .tagline .hl{
      color:var(--accent);
      font-weight:700;
    }
    .quote{
      max-width:400px;
      padding:18px 22px;
      background:var(--panel);
      backdrop-filter:blur(16px);
      border:1px solid var(--border);
      border-left:3px solid var(--accent);
      border-radius:12px;
      text-align:left;
      margin-bottom:30px;
      box-shadow:0 8px 32px rgba(0,0,0,.18);
    }
    .quote p{
      font-family:"Inter",sans-serif;
      font-size:.92rem;
      line-height:1.75;
      color:#e9e5f3;
      margin-bottom:12px;
    }
    .quote-name{
      font-family:"Space Grotesk",sans-serif;
      font-size:.76rem;
      font-weight:700;
      letter-spacing:.07em;
      text-transform:uppercase;
      color:var(--accent);
      display:block;
      margin-bottom:3px;
    }
    .quote-role{
      font-family:"Inter",sans-serif;
      font-size:.68rem;
      font-weight:400;
      letter-spacing:.05em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .btn-start{
      display:inline-flex;
      align-items:center;
      gap:14px;
      background:var(--accent);
      color:#171020;
      border:none;
      border-radius:100px;
      padding:17px 42px;
      font-family:"Space Grotesk",sans-serif;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      letter-spacing:.01em;
      box-shadow:0 8px 34px rgba(185,162,248,.18);
      transition:transform .2s,box-shadow .2s,background .22s;
    }
    .btn-start:hover{
      transform:translateY(-3px) scale(1.025);
      background:#c9b7ff;
      box-shadow:0 16px 48px rgba(185,162,248,.30);
    }
    .btn-start:active{
      transform:scale(.97);
    }
    .arrow{
      font-size:1.2rem;
      display:inline-block;
      transition:transform .2s;
    }
    .btn-start:hover .arrow{
      transform:translateX(5px);
    }
    .hint{
      margin-top:12px;
      font-size:.75rem;
      color:rgba(226,221,240,.65);
      letter-spacing:.04em;
    }
    .out{
      position:fixed;
      inset:0;
      z-index:999;
      background:var(--bg);
      opacity:0;
      pointer-events:none;
      transition:opacity .5s ease;
    }
    .out.go{
      opacity:1;
    }
    @media(max-width:600px){
      .center{padding:20px}
      .logo-pill{padding:7px 22px 7px 7px;gap:10px}
      .logo-icon{width:48px;height:48px}
      .logo-text{font-size:1.4rem}
      .quote{max-width:340px;padding:15px 18px}
      .quote p{font-size:.85rem}
      .btn-start{padding:16px 32px}
      .r1{width:260px;height:260px}
      .r2{width:350px;height:350px}
      .hint{font-size:.68rem}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>
<body>
  <div class="hands-frame">
    <img class="hands-img" src="/static/hands-circle.png" alt="Signing hands"/>
    <div class="wash"></div>
  </div>
  <div style="position:fixed;inset:0;z-index:20;pointer-events:none;">
    <div class="rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
    </div>
  </div>
  <div class="center">
    <div class="badge">🤟 Indian Sign Language</div>
    <div class="logo-pill">
      <div class="logo-icon">
        <img src="/static/logo.png" alt="GestureTalk"/>
      </div>
      <div class="logo-text">GestureTalk</div>
    </div>
    <div class="tagline">Where every <span class="hl">sign</span><br/>finds its voice.</div>
    <div class="quote">
      <p>"The limits of my language mean the limits of my world. Break those limits — give every hand a voice."</p>
      <span class="quote-name">Ludwig Wittgenstein (adapted)</span>
      <span class="quote-role">Philosopher</span>
    </div>
    <button class="btn-start" onclick="enterApp()">
      Let's Get Started <span class="arrow">→</span>
    </button>
    <div class="hint">ISL &nbsp;·&nbsp; Real-time detection &nbsp;·&nbsp; 20+ languages</div>
  </div>
  <div class="out" id="out"></div>
  <script>
    function enterApp(){
      document.getElementById('out').classList.add('go');
      setTimeout(()=>{
        window.location.href='/app';
      },580);
    }
  </script>
</body>
</html>
