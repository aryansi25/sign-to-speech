<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GestureTalk — Automated Benchmark Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#f8f7fc;
      --surface:#ffffff;
      --ink:#201b2e;
      --muted:#898397;
      --purple:#9b80e8;
      --purple-dark:#8062d1;
      --purple-light:#f0ebfc;
      --border:#e9e5f1;
      --success:#438b69;
      --danger:#c45b68;
      --shadow:0 5px 25px rgba(35,25,60,.055);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;padding:24px 20px;}
    .container{max-width:1200px;margin:0 auto;}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
    .logo-text{font-family:"Space Grotesk",sans-serif;font-size:1.4rem;font-weight:700;}
    .home-link{color:var(--purple-dark);text-decoration:none;font-weight:600;font-size:.88rem;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;}
    h1{font-family:"Space Grotesk",sans-serif;font-size:1.6rem;margin-bottom:8px;}
    p.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px;}
    .btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-weight:600;cursor:pointer;font-size:.9rem;transition:background .2s;}
    .btn:hover{background:var(--purple-dark);}
    table{width:100%;border-collapse:collapse;margin-top:20px;}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:.88rem;}
    th{background:var(--purple-light);color:var(--ink);font-weight:600;}
    .badge-pass{background:rgba(67,139,105,.12);color:var(--success);padding:4px 10px;border-radius:100px;font-weight:600;font-size:.78rem;}
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-text">GestureTalk Benchmark Runner</div>
    <a href="/app" class="home-link">← Back to App</a>
  </header>
  <div class="card">
    <h1>GestureTalk Benchmark Runner</h1>
    <p class="sub">Automated real-time evaluation dashboard across 27 ISL classes.</p>
    <button class="btn" id="btn-run-all">▶ Run All 27 Gesture Tests</button>
  </div>
  <div class="card">
    <h2>ISL Vocabulary Evaluation Table</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Gesture Class</th>
          <th>Predicted</th>
          <th>Confidence</th>
          <th>Latency (ms)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="test-table-body">
        <tr>
          <td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">Click "Run All 27 Gesture Tests" to begin live evaluation.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
